[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ehentai-downloader"
version = "0.1.0"
description = "A Python library for downloading E-Hentai albums"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "EHentaiDownloader Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fake-useragent>=1.1.3",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Lysagxra/EHentaiDownloader"
Repository = "https://github.com/Lysagxra/EHentaiDownloader"

[tool.setuptools]
packages = ["ehentai_downloader"]
